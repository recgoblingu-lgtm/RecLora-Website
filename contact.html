<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - RecLora</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .contact-form { display: flex; flex-direction: column; gap: 1rem; max-width: 500px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 0.5rem; font-weight: 600; }
        .form-group input, .form-group textarea { padding: 0.75rem; background: #2A2A2A; border: 1px solid #333; border-radius: 8px; color: white; }
        .form-group textarea { resize: vertical; min-height: 150px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">RecLora</div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="download.html" class="nav-link">Download</a></li>
                <li><a href="news.html" class="nav-link">News</a></li>
                <li><a href="roadmap.html" class="nav-link">Roadmap</a></li>
                <li><a href="faq.html" class="nav-link">FAQ</a></li>
                <li><a href="team.html" class="nav-link">Team</a></li>
                <li><a href="contact.html" class="nav-link active">Contact</a></li>
                <li><a href="rules.html" class="nav-link">Rules</a></li>
                <li><a href="fanart.html" class="nav-link">Fan Art</a></li>
            </ul>
        </div>
    </nav>
    <main class="container">
        <h1>Contact Us</h1>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-top: 2rem;">
            <div class="card">
                <h2>Get in Touch</h2>
                <p style="color: #aaa; margin-bottom: 1rem;">Join our Discord community or email us.</p>
                <a href="https://discord.gg/bJBuP4hwXz" class="btn btn-primary" target="_blank">Join Discord</a>
            </div>
            <div class="card">
                <h2>Send Message</h2>
                <form class="contact-form" id="contactForm">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" required></textarea>
                    </div>
                    <button type="submit" id="submitBtn" class="btn btn-primary">Send</button>
                </form>
            </div>
        </div>
    </main>
    <footer class="footer">
        <p>&copy; 2026 RecLora. <a href="https://discord.gg/bJBuP4hwXz" target="_blank">Discord</a></p>
    </footer>

    <script>
        // 1. Replace this URL with your actual Discord Webhook URL
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1536057190702514447/-HxbTMl_jZMEmliga985X5cWIbvEhPIk3JR20MTwsVo8Gi8Mxz4VHLbDcymKebAC7yCl";

        document.getElementById("contactForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById("submitBtn");
            submitBtn.disabled = true;
            submitBtn.textContent = "Sending...";

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const message = document.getElementById("message").value;

            // Format message neatly using Discord embeds
            const payload = {
                username: "Website Contact Form",
                embeds: [
                    {
                        title: "New Contact Form Submission",
                        color: 5814783, // Hex color in decimal (e.g., #5865F2)
                        fields: [
                            { name: "Name", value: name, inline: true },
                            { name: "Email", value: email, inline: true },
                            { name: "Message", value: message }
                        ],
                        timestamp: new Date().toISOString()
                    }
                ]
            };

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert("Thank you! Your message has been sent.");
                    document.getElementById("contactForm").reset();
                } else {
                    alert("Failed to send message. Please try again later.");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("An error occurred while sending your message.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Send";
            }
        });
    </script>
</body>
</html>
